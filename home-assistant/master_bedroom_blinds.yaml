# Master Bedroom Motionblinds schedule (evening)
#
#   8:30 PM  -> blinds still up go halfway (50%; the Slider's halfway is
#               62%); blinds already
#               down (15% or less) are left down
#  10:15 PM  -> close all blinds fully, except the Slider while
#               input_boolean.slider_keep_open_tonight is on (set by
#               choosing 'Leave open' on the phone prompt)
#   9:00 AM  -> separate automation: master_bedroom_blinds_morning.yaml
#
# The two closing steps are skipped while the helper
# binary_sensor.master_bedroom_blinds_off_position is ON, i.e. a blind sits
# somewhere other than open, closed or its halfway (each +/-15%; halfway
# is 50% except the Slider, 62%; open is 85%+ except Back Right, 80%+). That helper is a
# Template binary sensor created in the HA UI (Settings > Helpers), with this
# state template:
#
#   {% set tol = 15 %}{% set half = {'cover.honeycombblind_0004': 62} %}
#   {% set open_from = {'cover.honeycombblind_0003': 80} %}
#   {% set ns = namespace(odd=false) %}
#   {% for b in ['cover.honeycombblind_0001','cover.honeycombblind_0002',
#                'cover.honeycombblind_0003','cover.honeycombblind_0004'] %}
#     {% set p = state_attr(b, 'current_position') | int(-1) %}
#     {% set h = half.get(b, 50) %}{% set o = open_from.get(b, 100 - tol) %}
#     {% if not ((0 <= p <= tol) or (p >= o) or ((p - h) | abs <= tol)) %}
#       {% set ns.odd = true %}
#     {% endif %}
#   {% endfor %}{{ ns.odd }}
#
# Keeping the check in a helper means the automation itself has only plain
# conditions, so it reads cleanly in the visual editor.

alias: Master Bedroom Blinds Schedule
description: >-
  Halfway at 8:30 PM, fully closed at 10:15 PM. Both steps are skipped while
  'Master Bedroom Blinds Off Position' is on. The 9:00 AM open is a separate
  automation, 'Master Bedroom Blinds Morning Open'.
mode: single
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: "20:30:00"
    id: halfway
  - trigger: time
    at: "22:15:00"
    id: close

actions:
  - choose:
      - alias: 8:30 PM — halfway for blinds still up; leave closed ones down
        conditions:
          - condition: trigger
            id: halfway
          - condition: state
            entity_id: binary_sensor.master_bedroom_blinds_off_position
            state: "off"
        sequence:
          - alias: Back Left → halfway if above 15%
            if:
              - condition: numeric_state
                entity_id: cover.honeycombblind_0001
                attribute: current_position
                above: 15
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.honeycombblind_0001
                data:
                  position: 50
          - alias: Back Middle → halfway if above 15%
            if:
              - condition: numeric_state
                entity_id: cover.honeycombblind_0002
                attribute: current_position
                above: 15
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.honeycombblind_0002
                data:
                  position: 50
          - alias: Back Right → halfway if above 15%
            if:
              - condition: numeric_state
                entity_id: cover.honeycombblind_0003
                attribute: current_position
                above: 15
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.honeycombblind_0003
                data:
                  position: 50
          - alias: Slider → 62% (its halfway) if above 15%
            if:
              - condition: numeric_state
                entity_id: cover.honeycombblind_0004
                attribute: current_position
                above: 15
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.honeycombblind_0004
                data:
                  position: 62

      - alias: 10:15 PM — close (Slider skipped if Keep Open Tonight is on; all skipped if a blind is at an odd position)
        conditions:
          - condition: trigger
            id: close
          - condition: state
            entity_id: binary_sensor.master_bedroom_blinds_off_position
            state: "off"
        sequence:
          - alias: Close Back Left, Back Middle, Back Right
            action: cover.close_cover
            target:
              entity_id:
                - cover.honeycombblind_0001
                - cover.honeycombblind_0002
                - cover.honeycombblind_0003
          - alias: Close the Slider unless 'Leave open' was chosen
            if:
              - condition: state
                entity_id: input_boolean.slider_keep_open_tonight
                state: "off"
            then:
              - action: cover.close_cover
                target:
                  entity_id: cover.honeycombblind_0004
