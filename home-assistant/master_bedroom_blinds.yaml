# Master Bedroom Motionblinds schedule
#
#   8:30 PM  -> close all blinds halfway (position 50)
#  10:15 PM  -> close all blinds fully
#   9:00 AM  -> open all blinds
#
# The two closing steps are skipped while the helper
# binary_sensor.master_bedroom_blinds_off_position is ON, i.e. a blind sits
# somewhere other than open, closed or halfway (each +/-20%). That helper is a
# Template binary sensor created in the HA UI (Settings > Helpers), with this
# state template:
#
#   {% set tol = 20 %}{% set ns = namespace(odd=false) %}
#   {% for b in ['cover.honeycombblind_0001','cover.honeycombblind_0002',
#                'cover.honeycombblind_0003','cover.honeycombblind_0004'] %}
#     {% set p = state_attr(b, 'current_position') | int(-1) %}
#     {% if not ((0 <= p <= tol) or (p >= 100 - tol) or ((p - 50) | abs <= tol)) %}
#       {% set ns.odd = true %}
#     {% endif %}
#   {% endfor %}{{ ns.odd }}
#
# Keeping the check in a helper means the automation itself has only plain
# conditions, so it reads cleanly in the visual editor.

alias: Master Bedroom Blinds Schedule
description: >-
  Halfway at 8:30 PM, fully closed at 10:15 PM, open at 9:00 AM. The two
  closing steps are skipped while 'Master Bedroom Blinds Off Position' is on.
mode: single
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: "20:30:00"
    id: halfway
  - trigger: time
    at: "22:15:00"
    id: close
  - trigger: time
    at: "09:00:00"
    id: open

actions:
  - choose:
      - alias: 8:30 PM — halfway (skipped if a blind is at an odd position)
        conditions:
          - condition: trigger
            id: halfway
          - condition: state
            entity_id: binary_sensor.master_bedroom_blinds_off_position
            state: "off"
        sequence:
          - action: cover.set_cover_position
            target:
              entity_id: &blinds
                - cover.honeycombblind_0001
                - cover.honeycombblind_0002
                - cover.honeycombblind_0003
                - cover.honeycombblind_0004
            data:
              position: 50

      - alias: 10:15 PM — close (skipped if a blind is at an odd position)
        conditions:
          - condition: trigger
            id: close
          - condition: state
            entity_id: binary_sensor.master_bedroom_blinds_off_position
            state: "off"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: *blinds

      - alias: 9:00 AM — open
        conditions:
          - condition: trigger
            id: open
        sequence:
          - action: cover.open_cover
            target:
              entity_id: *blinds
